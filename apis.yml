name: Sunnyside
description: Sunnyside is a digital health platform for alcohol moderation, founded in 2020, that
  helps members cut back on or quit drinking through personalized weekly plans, drink tracking and
  analytics, human text-based coaching, habit-building exercises, and a supportive community. Its
  separate Sunnyside Med telehealth service connects members with licensed providers who can prescribe
  compounded naltrexone. Sunnyside is a consumer mobile app and telehealth service and does not
  currently publish a public developer API, SDKs, or developer documentation. It was surfaced as a
  portfolio company of Uncork Capital.
